name: SQL Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fraud_detection
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Schema Migration
        run: |
          mysql -h 127.0.0.1 -u root -proot fraud_detection < sql/01_schema.sql

      - name: Ingest Seed Fixtures
        run: |
          mysql -h 127.0.0.1 -u root -proot fraud_detection < sql/02_sample_data.sql

      - name: Deploy Stored Procedures & Triggers
        run: |
          mysql -h 127.0.0.1 -u root -proot fraud_detection < sql/03_stored_procedure_trigger.sql

      - name: Execute Analytical Fraud Queries
        run: |
          mysql -h 127.0.0.1 -u root -proot fraud_detection < sql/04_queries.sql
